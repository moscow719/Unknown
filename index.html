<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>For Doda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap">
<style>
:root {
  --bg: #fbf5f3;
  --fg: #3b2430;
  --muted: #8d6d79;
  --accent: #c0456c;
  --card: #ffffff;
  --line: #ecdbe1;
  --overlay: rgba(251, 245, 243, .82);
  --bg-img: url("doda_bg.jpg");
  font-family: "Cairo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1217; --fg: #f6e9ee; --muted: #b898a4; --accent: #f08aa6;
    --card: #2a1b22; --line: #4b2f3b; --overlay: rgba(29, 18, 23, .82); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1217; --fg: #f6e9ee; --muted: #b898a4; --accent: #f08aa6;
  --card: #2a1b22; --line: #4b2f3b; --overlay: rgba(29, 18, 23, .82); color-scheme: dark;
}
body {
  background: linear-gradient(var(--overlay), var(--overlay)), var(--bg-img) center / cover no-repeat, var(--bg);
  min-height: 100vh;
  color: var(--fg);
  margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px;
  line-height: 1.9;
  direction: rtl;
  text-align: start;
}
main { max-width: 560px; margin: 0 auto; }
h1 { font-weight: 900; font-size: 1.9rem; margin: 0 0 8px; text-wrap: balance; }
.msg { font-size: 1.08rem; min-height: 2em; }
.msg p { margin: 0 0 14px; }
.cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); vertical-align: middle; animation: blink 1s steps(2) infinite; }
@keyframes blink { to { visibility: hidden; } }
button.reveal {
  font: inherit; font-weight: 700; color: #fff; background: var(--accent);
  border: 0; border-radius: 999px; padding: 12px 22px; cursor: pointer; margin-top: 8px;
}
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.section-title { font-weight: 700; color: var(--muted); font-size: 1rem; letter-spacing: .02em; margin: 36px 0 12px; text-align: center; }
.station {
  text-align: center; padding: 4px 16px; margin-bottom: 20px;
}
.station small { color: var(--muted); display: block; }
.coupons { display: grid; gap: 12px; }
.coupon {
  font: inherit; text-align: start; color: var(--fg); background: var(--card);
  border: 1px dashed var(--accent); border-radius: 14px; padding: 16px 18px; cursor: pointer;
  display: flex; gap: 12px; align-items: center; min-width: 0;
}
.coupon .tag { flex: none; font-weight: 900; color: var(--accent); }
.coupon span.text { min-width: 0; }
.coupon.used { opacity: .45; text-decoration: line-through; cursor: default; border-style: solid; }
.note { color: var(--muted); font-size: .9rem; margin-top: 14px; }
[hidden] { display: none !important; }
.secret { color: var(--muted); margin: 12px 0 0; }
#surprise { margin-top: 20px; }
#surprise-text { color: var(--accent); font-weight: 700; margin-top: 14px; }
#title { cursor: pointer; }
.gate-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
#no { background: var(--card); color: var(--fg); border: 1px solid var(--line); }
#gate { max-width: 420px; margin: 70px auto 0; padding: 36px 24px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 18px 40px rgba(0, 0, 0, .08); }
#gate .msg { font-size: 1.2rem; font-weight: 700; margin: 0; }
#page h1 {
  text-align: center; font-size: 2.2rem; letter-spacing: .02em;
  background: linear-gradient(90deg, #c0456c, #f08aa6, #c0456c);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
#page h1::before, #page h1::after { -webkit-text-fill-color: var(--accent); color: var(--accent); background: none; }
#page h1 span { display: inline-block; animation: wave 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * .12s); }
@keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { #page h1 span { animation: none; } }
#page h1::before, #page h1::after { content: none; }
.song { display: inline-block; font-weight: 700; color: #fff; background: var(--accent); border-radius: 999px; padding: 12px 22px; text-decoration: none; }
.sign {text-align: center; font-weight: 900; font-size: 1.4rem; letter-spacing: .08em; color: var(--accent); transform: rotate(-4deg); margin: -6px 0 24px; text-shadow: 0 2px 0 rgba(0, 0, 0, .08); }
.spark { position: fixed; font-size: 18px; pointer-events: none; transform: translate(-50%, -50%); animation: spark 1s ease-out forwards; }
@keyframes spark { to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.4); opacity: 0; } }
.roses { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; font-size: 2.4rem; margin-top: 28px; }
.roses span { display: inline-block; transform: scale(0); animation: bloom .9s cubic-bezier(.2, .8, .2, 1) forwards; }
@keyframes bloom { to { transform: scale(1); } }
.heart { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; color: var(--accent); font-size: clamp(7px, 2vw, 13px); line-height: 1.2; margin: 28px auto 0; max-width: 100%; overflow-x: auto; text-align: center; white-space: pre; animation: glow 2.4s ease-in-out infinite; }
@keyframes glow {
  0%, 100% { text-shadow: 0 0 4px var(--accent); }
  50% { text-shadow: 0 0 14px var(--accent), 0 0 26px var(--accent); }
}
@media (prefers-reduced-motion: reduce) { .heart { animation: none; } }
@keyframes fadeIn { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .heart { opacity: 1; animation: none; } }
@media (prefers-reduced-motion: reduce) { .roses span { transform: none; animation: none; } }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
</style>

<main>
  <div id="gate">
    <p class="msg">عندي حاجة ليكي يا لولو... تحبي تشوفيها؟</p>
    <div class="gate-actions">
      <button class="reveal" id="yes">موافق</button>
      <button class="reveal no" id="no">لا</button>
    </div>
  </div>
  <div id="page" hidden>
  <h1 id="title">يا لولو، سوري 💛</h1>  <div class="msg" id="msg" aria-live="polite"></div>  <section id="rest">
    <h2 class="section-title">فاكرة دي 👀</h2>
    <div class="station">
      <strong>الملاحات</strong>
      <small>المكان اللي بنعدي عليه وإحنا رايحين الكلية. كل مرة بفتكر ضحكتك هناك.</small>
    </div>
    <p style="text-align: center; margin-top: 24px;">
      <a class="song" href="https://www.tiktok.com/@loyd_100/video/7700332082979032328?is_from_webapp=1&sender_device=pc" target="_blank" rel="noopener">Surprise 💌</a>
    </p>
  </section>
  </div>
</main>

<script>
const lines = [
  "كل سنة وانتي طيبة يا دودااا وعقبال مليون سنة وانتي مبسوطة وناجحة ودايما ضحكتك منورة وشك وروحك الحلوة موجودة في كل مكان",
  "يا رب السنة الجديدة دي تكون بداية لكل حاجة حلوة في حياتك وتحققي فيها كل اللي نفسك فيه وتشوفي فيها فرحة على قد قلبك وتكون أيامك كلها راحة بال ونجاح وسعادة بجد أنا بتمنالك كل الخير من قلبي ونفسي أشوفك دايما مبسوطة وناجحة وتوصلي لكل حاجة بتحلمي بيها ومهما حصل تفضلي بنفس طيبتك وروحك الجميلة اللي تميزك عن أي حد وعقبال ما نحقق كل الكلام والأحلام اللي بنتكلم عنها ونفتكر الأيام دي ونضحك عليها سوا",
  "وأهم حاجة بقى متنسيش الشراكة اللي هنعملها سوا عشان أنا لسه معتمد عليكي فيها ومش هقبل بأي تأجيل 😂 وإن شاء الله ننجح ونعمل حاجة كبيرة سوا وتكون دي مجرد بداية لحاجات كتير حلوة جاية لينا",
  "انبسطي بيومك يا دودا واتبسطي على الآخر لأنك تستاهلي كل حاجة حلوة في الدنيا وكل سنة وانتي طيبة يا لولو وعقبال سنين كتير أوي كلها ضحك وهزار ونجاح وذكريات حلوة وربنا يديم عليكي الفرحة ويخليكي دايما مبسوطة"
];
const msg = document.getElementById("msg");
const reveal = document.getElementById("reveal");
const rest = document.getElementById("rest");
const note = document.getElementById("note");
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function store(get, val) {
  try {
    if (get) return localStorage.getItem("sorry-" + get);
    localStorage.setItem("sorry-" + val[0], val[1]);
  } catch (e) { return null; }
  return null;
}

function typeLines(i = 0) {
  if (i >= lines.length) { bloom(); return; }
  const p = document.createElement("p");
  msg.appendChild(p);
  if (reduce) { p.textContent = lines[i]; return typeLines(i + 1); }
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  let j = 0;
  const timer = setInterval(() => {
    p.textContent = lines[i].slice(0, ++j);
    p.appendChild(cursor);
    if (j >= lines[i].length) { clearInterval(timer); cursor.remove(); setTimeout(() => typeLines(i + 1), 400); }
  }, 35);
}



function fillRun(L) {
  let s = "";
  while (s.length + (s ? 5 : 4) <= L) s += (s ? " " : "") + "Doda";
  const pad = L - s.length;
  const left = Math.floor(pad / 2);
  return " ".repeat(left) + s + " ".repeat(pad - left);
}

function heartText() {
  const rows = [];
  for (let y = 1.25; y >= -1.2; y -= 0.08) {
    const cells = [];
    for (let x = -1.4; x <= 1.4; x += 0.04) {
      cells.push(Math.pow(x * x + y * y - 1, 3) - x * x * y * y * y <= 0);
    }
    let row = "";
    let i = 0;
    while (i < cells.length) {
      if (!cells[i]) { row += " "; i++; continue; }
      let j = i;
      while (j < cells.length && cells[j]) j++;
      row += fillRun(j - i);
      i = j;
    }
    rows.push(row);
  }
  return rows.join("\n");
}

function bloom() {
  const full = heartText();
  const heart = document.createElement("pre");
  heart.className = "heart";
  const shown = document.createElement("span");
  const rest = document.createElement("span");
  rest.style.visibility = "hidden";
  heart.append(shown, rest);
  msg.appendChild(heart);
  heart.addEventListener("click", e => burst(e.clientX, e.clientY));
  if (reduce) { shown.textContent = full; rest.textContent = ""; return; }
  let i = 0;
  const timer = setInterval(() => {
    i = Math.min(full.length, i + 3);
    shown.textContent = full.slice(0, i);
    rest.textContent = full.slice(i);
    if (i >= full.length) clearInterval(timer);
  }, 15);
}

function burst(x, y) {
  for (let k = 0; k < 12; k++) {
    const s = document.createElement("span");
    s.className = "spark";
    s.textContent = "❤️";
    const a = Math.random() * Math.PI * 2;
    const d = 60 + Math.random() * 60;
    s.style.left = x + "px";
    s.style.top = y + "px";
    s.style.setProperty("--dx", Math.cos(a) * d + "px");
    s.style.setProperty("--dy", Math.sin(a) * d + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}


const no = document.getElementById("no");
let noX = 0, noY = 0, lastMove = 0;
const noCenter = () => {
  const r = no.getBoundingClientRect();
  return { x: r.left + r.width / 2 - noX, y: r.top + r.height / 2 - noY };
};
const moveNo = (px, py) => {
  const base = noCenter();
  let x = 0, y = 0;
  for (let t = 0; t < 20; t++) {
    x = (Math.random() * 2 - 1) * 170;
    y = (Math.random() * 2 - 1) * 90;
    const cx = base.x + x, cy = base.y + y;
    if (px === undefined || Math.hypot(px - cx, py - cy) > 180) break;
  }
  noX = x; noY = y; lastMove = Date.now();
  no.style.transform = `translate(${x}px, ${y}px)`;
};
document.addEventListener("pointermove", e => {
  if (Date.now() - lastMove < 300) return;
  const c = noCenter();
  if (Math.hypot(e.clientX - c.x - noX, e.clientY - c.y - noY) < 110) moveNo(e.clientX, e.clientY);
});
no.addEventListener("pointerenter", e => moveNo(e.clientX, e.clientY));
no.addEventListener("pointerdown", e => { e.preventDefault(); moveNo(e.clientX, e.clientY); });
no.addEventListener("click", e => { e.preventDefault(); moveNo(e.clientX, e.clientY); });

document.getElementById("yes").addEventListener("click", () => {
  document.getElementById("gate").hidden = true;
  document.getElementById("page").hidden = false;
  typeLines();
});

const titleEl = document.getElementById("title");
const titleText = titleEl.textContent;
titleEl.textContent = "";
[...titleText].forEach((ch, i) => {
  const s = document.createElement("span");
  s.textContent = ch === " " ? " " : ch;
  s.style.setProperty("--i", i);
  titleEl.appendChild(s);
});
</script>

</body></html>
